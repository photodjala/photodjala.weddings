  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f5f2ec;
      --muted: #b9b3aa;
      --accent: #d6b77a;
      --line: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #0a0a0a; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 22px;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 8%, rgba(214,183,122,.12), transparent 46%),
        linear-gradient(180deg, #111 0%, #090909 55%, #050505 100%);
      text-align: center;
    }

    .wrap { width: min(620px, 100%); }

    .brand img {
      height: 3.4rem;
      width: auto;
      margin-bottom: 46px;
      opacity: .9;
    }

    .code {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(88px, 22vw, 168px);
      line-height: .9;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 6px 60px rgba(214,183,122,.22);
    }

    .rule {
      width: 74px;
      height: 1px;
      margin: 26px auto 24px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(28px, 5.6vw, 42px);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
      max-width: 46ch;
      margin: 0 auto 30px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .btn-primary { background: var(--accent); color: #111; border: 1px solid var(--accent); }
    .btn-primary:hover { transform: translateY(-2px); background: #e3c98f; }

    .btn-ghost { border: 1px solid var(--line); color: var(--text); }
    .btn-ghost:hover { transform: translateY(-2px); border-color: var(--text); }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 10.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      transition: color .2s ease;
    }

    .links a:hover { color: var(--accent); }

    .since {
      margin-top: 26px;
      color: #7d786f;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .brand img { height: 2.7rem; margin-bottom: 34px; }
      .btn { padding: 13px 20px; font-size: 11px; }
      .links { gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
